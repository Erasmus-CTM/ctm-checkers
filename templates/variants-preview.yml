name: Variants trusted sticky preview
on:
  workflow_run:
    workflows: [Variants]
    types: [completed]
permissions: {}
concurrency:
  group: variants-preview-pages-${{ github.repository }}
  cancel-in-progress: false
jobs:
  sticky:
    # workflow_run code comes from the default branch. Never checkout the
    # triggering run's head or execute its artifact/course HTML in this job.
    if: github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Export authenticated exact-run review pages without executing HTML
        id: preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -I _extensions/ctm-checkers/native-authoring/ctm-variants-bot.py --producer-manifest .github/ctm-variants-producer.json --export-preview "$RUNNER_TEMP/ctm-verified-preview"
      - name: Preserve existing site while publishing the fixed PR preview subtree
        if: steps.preview.outputs.publish == 'true'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ github.token }}
          publish_branch: gh-pages
          publish_dir: ${{ runner.temp }}/ctm-verified-preview
          destination_dir: ${{ steps.preview.outputs.destination }}
          keep_files: true
          force_orphan: false
      - name: Verify neutral artifact and reconcile own sticky comments
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -I _extensions/ctm-checkers/native-authoring/ctm-variants-bot.py --producer-manifest .github/ctm-variants-producer.json --refresh-preview
