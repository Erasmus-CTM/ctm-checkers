name: Variants
on:
  pull_request:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact PR head to check
        required: true
        type: string
      pull_request:
        description: Same-repository PR number
        required: true
        type: string
      generate_more:
        description: Optional native question label to generate up to 25 more tested proposals without saving
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
jobs:
  variants-records:
    # Authored variables/checkers run only in this unprivileged job. Forks can
    # be checked, while the separate privileged sticky/decide jobs reject them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.expected_head }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          path: authored
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b
        with:
          version: '1.8.27'
      - name: Install reviewed native Python dependencies
        run: python -m pip install --requirement trusted/.github/ctm-variants-requirements.txt
      - name: Produce exact-head tested records and canonical review HTML
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -I trusted/.github/scripts/ctm-variants-records.py --project authored --trusted trusted --output "$RUNNER_TEMP/ctm-variants"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ctm-variants-records
          path: ${{ runner.temp }}/ctm-variants/variants-records.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ctm-pool-checks
          path: ${{ runner.temp }}/ctm-variants/pool-checks.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ctm-variants-review
          path: ${{ runner.temp }}/ctm-variants/review/
          if-no-files-found: warn
  check:
    name: variants / check
    needs: variants-records
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.expected_head }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          path: authored
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ctm-variants-records
          path: ${{ runner.temp }}/ctm-variants
      - name: Enforce current required approvals independently of review output
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -I trusted/.github/scripts/ctm-variants-records.py --project authored --trusted trusted --output "$RUNNER_TEMP/ctm-variants" --check
