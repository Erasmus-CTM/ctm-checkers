name: Tests

# Default PR/main gate: Python 3.12, source and actual-wheel tests, canonical
# payload/release/changelog checks and pip installation. Explicitly authorized
# manual campaigns retain all five versions, golden replays and mutations.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'AC authorization: enter broad testing campaign'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ctm-checkers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.confirmation == 'broad testing campaign' && '["3.9","3.10","3.11","3.12","3.13"]' || '["3.12"]') }}
    env:
      CTM_LEGACY_MATH_EXERCISE: _ci/math-exercise
      CTM_LEGACY_STACK_SYMPY: _ci/stack-sympy
    steps:
      - name: Validate manual broad campaign authorization
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = 'broad testing campaign'
      - uses: actions/checkout@v7
      - name: Pinned commits
        id: pins
        run: jq -r 'to_entries[] | select(.value | type == "object") | "\(.key)=\(.value.commit)"' tools/pins.json >> "$GITHUB_OUTPUT"
      - name: math-exercise 0.10.0 (the legacy sources of the goldens)
        uses: actions/checkout@v7
        with:
          repository: Erasmus-CTM/math-exercise
          ref: ${{ steps.pins.outputs['math-exercise'] }}
          path: _ci/math-exercise
          persist-credentials: false
      - name: stack-sympy at f450bcd (the legacy sources of the STACK goldens)
        uses: actions/checkout@v7
        with:
          repository: Erasmus-CTM/stack-sympy
          ref: ${{ steps.pins.outputs['stack-sympy'] }}
          path: _ci/stack-sympy
          persist-credentials: false
      - name: The umbrella's parity harness (its authored-question recorder)
        uses: actions/checkout@v7
        with:
          repository: Erasmus-CTM/ctm-assessment
          ref: ${{ steps.pins.outputs['ctm-assessment'] }}
          path: _ci/ctm-assessment
          sparse-checkout: integration/pyodide-parity
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ci/requirements.txt
      - run: python -m pip install -r ci/requirements.txt
      - name: Quarto for native component source reconciliation
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.27
      - name: The generated extension folder matches src/; the releases of the base branch are unchanged
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
            python tools/build.py --check --released-base "$BASE"
          else
            python tools/build.py --check
          fi
      - name: A pull request that changes golden rows follows the rules of grading changes (H2, names, version, CHANGELOG)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python tools/golden.py check-changelog --base "$BASE"
      - name: Tests (src/)
        run: pytest -q tests
      - name: Tests (the built wheels)
        run: |
          folder="$PWD/_extensions/ctm-checkers"
          CTM_CHECKERS_WHEEL="$folder/$(jq -r .wheel "$folder/checkers.json"):$folder/$(jq -r .parts.stack.wheel "$folder/checkers.json")" pytest -q tests
      - name: The legacy code reproduces the golden tables
        if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'broad testing campaign'
        run: python tools/golden.py verify --adapter legacy --legacy _ci/math-exercise --stack-legacy _ci/stack-sympy
      - name: The built wheels reproduce the golden tables
        if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'broad testing campaign'
        run: python tools/golden.py verify --adapter wheel --variants _ci/math-exercise
      - name: The golden tables fail on mutations of the checks
        if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'broad testing campaign'
        run: CTM_MUTATION_TESTS=1 pytest -q -rA tests/test_mutations.py
      - name: The wheels install with pip
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          folder="_extensions/ctm-checkers"
          "$RUNNER_TEMP/venv/bin/python" -m pip install -q "$folder/$(jq -r .wheel $folder/checkers.json)" "$folder/$(jq -r .parts.stack.wheel $folder/checkers.json)"
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/venv/bin/python" -c "import ctm_checkers, ctm_checkers.math_exercise.checks as c, ctm_checkers.stack.engine as s; print(ctm_checkers.__version__, c.__file__, s.__file__)"
