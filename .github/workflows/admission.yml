name: Shared STACK admission
on:
  pull_request:
    paths:
      - 'src/ctm_checkers/stack/**'
      - 'tools/build.py'
      - 'tools/stack_native/admission_data.py'
      - 'tests/stack/test_shared_admission.py'
      - 'tests/stack/test_input_text.py'
      - 'tests/golden/stack/**'
      - '_extensions/ctm-checkers/**'
      - '.github/workflows/admission.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: pip install -r ci/requirements.txt
      - if: matrix.node == 24
        run: pip install playwright==1.58.0
      - if: matrix.node == 24
        run: python -m playwright install --with-deps chromium firefox webkit
      - name: Source admission compared with the existing Python boundary
        env:
          CTM_ADMISSION_BROWSER: ${{ matrix.node == 24 && 'all' || '' }}
          CTM_ADMISSION_REPORT: test-results/admission/source
        run: pytest -q tests/stack/test_shared_admission.py
      - name: Actual wheel resources and published payload compared with Python
        env:
          CTM_ADMISSION_BROWSER: ${{ matrix.node == 24 && 'all' || '' }}
          CTM_ADMISSION_REPORT: test-results/admission/wheel
        run: |
          folder="$PWD/_extensions/ctm-checkers"
          CTM_CHECKERS_WHEEL="$folder/$(jq -r .wheel "$folder/checkers.json"):$folder/$(jq -r .parts.stack.wheel "$folder/checkers.json")" pytest -q tests/stack/test_shared_admission.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: admission-node-${{ matrix.node }}
          path: test-results/admission
          if-no-files-found: error
