name: Resolved native candidate validation
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'AC authorization: enter broad testing campaign'
        required: true
        type: string

permissions:
  contents: read
jobs:
  authorize:
    name: Authorize broad testing campaign
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit campaign confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = 'broad testing campaign'
  validation:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install sympy==1.13.3
      - run: python -c "import sys,sympy; print(sys.version); print('SymPy',sympy.__version__)"
      - name: Resolved candidate and existing question-test contracts from source
        run: |
          python tests/test_variants_validation.py
          python -m pip install pytest PyYAML
          PYTHONPATH=src python -m pytest tests/test_question_tests.py -q
      - name: Native validation uses the unchanged actual browser wheel
        run: |
          folder="$PWD/_extensions/ctm-checkers"
          export CTM_CHECKERS_WHEEL="$folder/$(python -c 'import json; print(json.load(open("_extensions/ctm-checkers/checkers.json"))["wheel"])')"
          python tests/test_variants_validation.py
      - name: Canonical browser payload remains current
        run: python tools/build.py --check
