name: Native placeholder and display contracts
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'AC authorization: enter broad testing campaign'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native-placeholders-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = 'broad testing campaign'
  placeholders:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install sympy==1.13.3
      - run: python -c "import sys,sympy; print(sys.version); print('SymPy',sympy.__version__)"
      - name: Source placeholder and existing exact authoring contracts
        run: |
          python tests/test_variants_placeholders.py
          python tests/test_numeric_exact.py
          python tests/test_variants_enumeration.py
          python tests/test_variants_generation.py
      - name: Same contracts using the unchanged actual browser wheel
        run: |
          folder="$PWD/_extensions/ctm-checkers"
          export CTM_CHECKERS_WHEEL="$folder/$(python -c 'import json; print(json.load(open("_extensions/ctm-checkers/checkers.json"))["wheel"])')"
          python tests/test_variants_placeholders.py
          python tests/test_numeric_exact.py
          python tests/test_variants_enumeration.py
          python tests/test_variants_generation.py
      - run: python tools/build.py --check
