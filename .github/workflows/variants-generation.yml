name: Native variables execution kernel
on:
  push:
    branches: [consolidation/2026-10-native-variables]
    paths: ['authoring/ctm_variants/generation.py', 'tests/test_variants_generation.py', '.github/workflows/variants-generation.yml']
  pull_request:
    paths: ['authoring/ctm_variants/generation.py', 'tests/test_variants_generation.py', '.github/workflows/variants-generation.yml']
permissions:
  contents: read
jobs:
  execution:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install sympy==1.13.3
      - name: Report exact runtime
        run: python -c "import sys,sympy; print(sys.version); print('SymPy',sympy.__version__)"
      - name: Native bounded variables contracts
        run: python tests/test_variants_generation.py
